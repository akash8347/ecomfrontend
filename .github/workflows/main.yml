
on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
      
    - name: 🔨 Build Project
      run: |
        npm install
        npm run build
        
